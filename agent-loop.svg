<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 250" width="810" height="250" role="img" aria-label="Agentic AI loop: perceive, plan, act, observe" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="810" height="250" rx="16" fill="#0d1117"/>
  <text x="405" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8b949e" letter-spacing="2">THE AGENTIC AI LOOP</text>

  <!-- connectors -->
  <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="182" y1="85" x2="228" y2="85"/>
    <line x1="382" y1="85" x2="428" y2="85"/>
    <line x1="582" y1="85" x2="628" y2="85"/>
  </g>
  <!-- feedback loop -->
  <path d="M705,122 C705,230 105,230 105,122" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="405" y="222" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8b949e">feedback loop · memory · self-correction</text>

  <!-- moving signal (drawn before nodes so it slides "through" them) -->
  <g>
    <circle r="11" fill="#58a6ff" opacity="0.25"/>
    <circle r="5" fill="#58a6ff"/>
    <animateMotion dur="6s" repeatCount="indefinite" path="M105,85 L705,85 L705,122 C705,230 105,230 105,122 Z"/>
  </g>

  <!-- nodes -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="30" y="50" width="150" height="70" rx="12" fill="#161b22" stroke="url(#g)" stroke-width="2.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.25;1" dur="6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#24304d;#161b22;#161b22" keyTimes="0;0.25;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <text x="105" y="80" font-size="17" font-weight="700" fill="#e6edf3">Perceive</text>
    <text x="105" y="102" font-size="12" fill="#8b949e">goal · context</text>

    <rect x="230" y="50" width="150" height="70" rx="12" fill="#161b22" stroke="url(#g)" stroke-width="2.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.25;1" dur="6s" begin="0.89s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#24304d;#161b22;#161b22" keyTimes="0;0.25;1" dur="6s" begin="0.89s" repeatCount="indefinite"/>
    </rect>
    <text x="305" y="80" font-size="17" font-weight="700" fill="#e6edf3">Plan</text>
    <text x="305" y="102" font-size="12" fill="#8b949e">reason · decompose</text>

    <rect x="430" y="50" width="150" height="70" rx="12" fill="#161b22" stroke="url(#g)" stroke-width="2.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.25;1" dur="6s" begin="1.78s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#24304d;#161b22;#161b22" keyTimes="0;0.25;1" dur="6s" begin="1.78s" repeatCount="indefinite"/>
    </rect>
    <text x="505" y="80" font-size="17" font-weight="700" fill="#e6edf3">Act</text>
    <text x="505" y="102" font-size="12" fill="#8b949e">tools · APIs · code</text>

    <rect x="630" y="50" width="150" height="70" rx="12" fill="#161b22" stroke="url(#g)" stroke-width="2.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="1;0.35;0.35" keyTimes="0;0.25;1" dur="6s" begin="2.67s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#24304d;#161b22;#161b22" keyTimes="0;0.25;1" dur="6s" begin="2.67s" repeatCount="indefinite"/>
    </rect>
    <text x="705" y="80" font-size="17" font-weight="700" fill="#e6edf3">Observe</text>
    <text x="705" y="102" font-size="12" fill="#8b949e">verify · remember</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
